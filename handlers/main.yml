---
- name: Docker | Restart docker
  ansible.builtin.service:
    name: docker
    state: restarted

## 'Docker | Update apt cache' was removed. It was notified only by the
## repository task, and a cache refresh that happens only when the repository
## changes is refreshed on exactly the run that does not need it. The refresh
## is now an unconditional task in tasks/docker.yml, ordered after the
## repository and before the install.
